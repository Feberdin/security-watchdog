# Purpose: Block newly introduced secrets in this repository and every Feberdin
# repository that calls this workflow.
# Input/Output: Checks the pushed or pull-request commit range and fails on findings.
# Invariants: Read-only token, immutable action SHAs, fully redacted scanner output.
# Debugging: Reproduce with `gitleaks git . --redact=100 --no-banner`.

name: Reusable Secret Scan

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan changed commits
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
