[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-watchdog"
version = "0.1.0"
description = "Self-hosted GitHub supply-chain security monitoring platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - internal use until a formal LICENSE is chosen." }
authors = [
  { name = "Feberdin" }
]
dependencies = [
  "apscheduler>=3.11.3,<4.0.0",
  "defusedxml>=0.7.1,<1.0.0",
  "docker>=7.2.0,<8.0.0",
  "fastapi>=0.141.1,<1.0.0",
  "feedparser>=6.0.13,<7.0.0",
  "httpx>=0.28.1,<1.0.0",
  "jinja2>=3.1.6,<4.0.0",
  "packaging>=26.2,<27.0",
  "pydantic>=2.13.4,<3.0.0",
  "pydantic-settings>=2.14.2,<3.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "python-dateutil>=2.9.0.post0,<3.0.0",
  "python-slugify>=8.0.4,<9.0.0",
  "redis>=8.0.1,<9.0.0",
  "sqlalchemy>=2.0.51,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "pytest-mock>=3.14.0,<4.0.0",
  "ruff>=0.11.0,<1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]
ignore = [
  # FastAPI dependencies are intentionally declared as default values.
  "B008",
  # Scanner command execution is validated and shell-free in app.core.utils.
  "S603",
  "S607",
]

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["S104"]
"tests/*" = ["S101", "S105", "S108"]
