# Purpose: Local Docker Compose override for running the stack from a checked-out repository.
# Input/Output: Compose reads this file after `docker-compose.yml` and replaces broker-managed
# secret references with variables from the local, git-ignored `.env` file.
# Important invariants: Keep real values in `.env` only; this file may contain placeholders and
# variable names, but never credentials.
# Debugging: If local Compose fails with a missing-variable error, copy `.env.example` to `.env`
# and set `POSTGRES_PASSWORD`, `DATABASE_URL`, `DEPLOYMENT_GATE_TOKEN`, and `GITHUB_TOKEN` as needed.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting locally.}

  watchdog:
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env before starting locally.}
      DEPLOYMENT_GATE_TOKEN: ${DEPLOYMENT_GATE_TOKEN:?Set DEPLOYMENT_GATE_TOKEN in .env before starting locally.}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

  worker:
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env before starting locally.}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
